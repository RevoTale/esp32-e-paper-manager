<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Example dashboard</title>
  </head>
  <body>
    <main>
      <h1>Example dashboard</h1>
      <div class="dashboard-grid">
        <section class="card">
          <div class="card-heading">
            <h2>Service incidents</h2>
            <span class="count">1</span>
          </div>
          <ul>
            <li>
              <span>Example service unavailable</span>
              <span>2h</span>
            </li>
          </ul>
        </section>
        <section class="card">
          <div class="card-heading">
            <h2>Tasks</h2>
            <span class="count">3</span>
          </div>
          <h3>Overdue</h3>
          <ul>
            <li>
              <span>Review sample report</span>
              <span>2d</span>
            </li>
          </ul>
          <h3>Due today</h3>
          <ul>
            <li><span>Prepare example notes</span></li>
            <li><span>Read sample chapter</span></li>
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
