when:
  - event: [pull_request, push, manual]

clone:
  git:
    image: woodpeckerci/plugin-git:2.12.0
    settings:
      depth: 0
      partial: false
      fetch_target_branch: true

variables:
  - &image-labels
    title: ESP32 e-Paper Manager
    description: Build and verify e-paper manager and ESP32 firmware
    authors: RevoTale
    licenses: MIT

steps:
  - name: prepare-quality-dockerfile
    image: ghcr.io/revotale/ci/base:v0.1.8@sha256:c59b01e74acd309c9c775f594917df6d9f8cad93fdfa7f40408aebeb5140f414
    commands:
      - sed '1,/^FROM /s/^FROM .*/& AS quality/' .devcontainer/Dockerfile > .woodpecker/quality.generated.Dockerfile
      - cat .woodpecker/firmware.Dockerfile >> .woodpecker/quality.generated.Dockerfile
      - cp .woodpecker/firmware.Dockerfile.dockerignore .woodpecker/quality.generated.Dockerfile.dockerignore

  - name: quality-and-firmware
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    settings:
      <<: *image-labels
      dockerfile: .woodpecker/quality.generated.Dockerfile
      build_args:
        - QUALITY_TARGET_BRANCH=${CI_COMMIT_TARGET_BRANCH}
        - QUALITY_PREVIOUS_SHA=${CI_PREV_COMMIT_SHA}
        - QUALITY_EVENT=${CI_PIPELINE_EVENT}
        - RELEASE_COMMIT=${CI_COMMIT_SHA}
      repo: epaper-firmware-check
      dry_run: true
      output: type=local,dest=.ci-firmware

  - name: build-runtime
    image: ghcr.io/revotale/ci/buildx:v0.1.8@sha256:bbd7e0a849e2e87c6e1bbecc6f8caf7fae0849b84b7e6abab34af07f9b1657b9
    depends_on: []
    settings:
      <<: *image-labels
      dockerfile: Dockerfile
      repo: epaper-runtime-check
      build_args:
        - VCS_REF=${CI_COMMIT_SHA}
      platforms: linux/amd64,linux/arm64
      dry_run: true
