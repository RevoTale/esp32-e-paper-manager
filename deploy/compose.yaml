services:
  epaper-manager:
    image: ${EPAPER_IMAGE:?Set EPAPER_IMAGE to the published image digest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${EPAPER_DEVICE_BIND:?Set the server LAN IP}:9757:9757"
    volumes:
      - type: bind
        source: ${EPAPER_SECRETS_DIR:?Set the absolute secrets directory}
        target: /run/epaper
        read_only: true
        bind:
          create_host_path: false
    command:
      - -screen
      - -screen-transport=wifi
      - -trusted-html
      - -enrollment=/run/epaper/device.json
      - -token-file=/run/epaper/api-token
      - -tls-cert=/run/epaper/tls.crt
      - -tls-key=/run/epaper/tls.key
      - -https-listen=127.0.0.1:8443
      - -device-listen=0.0.0.0:9757
      - -refresh-policy
      - -full-interval=180s
      - -urgent-interval=30s
