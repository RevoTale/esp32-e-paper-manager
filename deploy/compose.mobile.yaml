# Merge with compose.setup.yaml using Docker Compose 2.24.4 or later.
services:
  epaper-manager:
    ports: !override
      - "${EPAPER_DEVICE_BIND:?Set the server interface address}:${EPAPER_DEVICE_PORT:-443}:9757"
    volumes:
      - type: bind
        source: ${EPAPER_MOBILE_DIR:?Set the absolute mobile-init directory}/device-tls.crt
        target: /run/epaper-device.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EPAPER_MOBILE_DIR:?Set the absolute mobile-init directory}/device-tls.key
        target: /run/epaper-device.key
        read_only: true
        bind:
          create_host_path: false
    command:
      - -screen
      - -screen-transport=wifi
      - -trusted-html
      - -enrollment=/data/credentials/device.json
      - -token-file=/data/credentials/api-token
      - -tls-cert=/data/credentials/tls.crt
      - -tls-key=/data/credentials/tls.key
      - -https-listen=127.0.0.1:8443
      - -device-listen=0.0.0.0:9757
      - -device-tls-cert=/run/epaper-device.crt
      - -device-tls-key=/run/epaper-device.key
      - -refresh-policy
      - -full-interval=180s
      - -urgent-interval=30s
